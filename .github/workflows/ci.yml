name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out test harness
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test harness dependencies
        run: npm ci

      - name: Lint test harness
        run: npm run lint

      - name: Check test harness formatting
        run: npm run format:check

      - name: Build test harness (TypeScript check)
        run: npm run build
